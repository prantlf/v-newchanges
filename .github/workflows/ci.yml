name: Build and Test or Release

on:
  push:
    branches:
      - master
    tags-ignore:
      - '**'
    paths-ignore:
      - '**/*.md'
      - LICENSE
  pull_request:

jobs:

  linux:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.bump.outputs.bumped }}
      changed-files: ${{ steps.bump.outputs.changed-files }}
    steps:
    - uses: actions/checkout@v7
    - uses: prantlf/setup-v-action@v4
    - uses: prantlf/bump-version-action@v3
      id: bump
      with:
        bump-files: newchanges.v
    - uses: prantlf/shelve-changes-action@v3
    - run: make
    - if: ${{ steps.bump.outputs.bumped == 'true' }}
      uses: prantlf/shelve-output-action@v4
      with:
        extra: man

  linux-riscv:
    if: ${{ github.ref_name == 'master' && needs.linux.outputs.changed == 'true' }}
    needs:
      - linux
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: prantlf/setup-v-action@v4
    - uses: prantlf/unshelve-changes-action@v3
      if: ${{ needs.linux.outputs.changed == 'true' }}
      with:
        files: ${{ needs.linux.outputs.changed-files }}
        discard-shelf: false
    - run: |
        sudo apt-get update
        sudo apt-get install gcc gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu
    - run: make build RELEASE=1 LINUX_RISCV=1
    - uses: prantlf/shelve-output-action@v4
      if: ${{ needs.linux.outputs.changed == 'true' }}
      with:
        arch: riscv64
        extra: man
